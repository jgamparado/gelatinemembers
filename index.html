<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Espace Membres | Pink Gelatin Trick</title>
    <meta name="description" content="Espace membres en français pour suivre le programme Pink Gelatin Trick.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-canvas">
      <div class="app-card" id="appCard">
        <header class="app-header">
          <a class="brand" href="#" id="brandLink" aria-label="Accueil">
            <span class="brand-kicker">PINK GELATIN</span>
            <span class="brand-name">Trick</span>
          </a>
          <div class="header-actions">
            <div class="streak-badge" id="streakBadge" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L20 12 L12 22 L4 12 Z"></path></svg>
              <span id="streakCount">0</span>
            </div>
            <button class="icon-btn" id="settingsBtn" type="button" aria-label="Paramètres" aria-haspopup="dialog">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="4" y1="8" x2="20" y2="8"></line><circle cx="15" cy="8" r="2.4" fill="currentColor" stroke="none"></circle><line x1="4" y1="16" x2="20" y2="16"></line><circle cx="9" cy="16" r="2.4" fill="currentColor" stroke="none"></circle></svg>
            </button>
          </div>
        </header>

        <main class="app-scroll" id="appScroll"></main>

        <nav class="bottom-nav" id="bottomNav" aria-label="Navigation principale">
          <button class="nav-btn" type="button" data-nav="home">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 L12 4 L20 11"></path><path d="M6 10 V20 H18 V10"></path></svg>
            <span data-label="nav.home">Accueil</span>
          </button>
          <button class="nav-btn" type="button" data-nav="program">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle><path d="M10 8.5 L16 12 L10 15.5 Z" fill="currentColor" stroke="none"></path></svg>
            <span data-label="nav.program">Programme</span>
          </button>
          <button class="nav-btn" type="button" data-nav="recipes">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 C7 9 6.5 13 12 19 C17.5 13 17 9 12 3 Z"></path></svg>
            <span data-label="nav.recipes">Recettes</span>
          </button>
          <button class="nav-btn" type="button" data-nav="tracker">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="3"></rect><line x1="4" y1="9" x2="20" y2="9"></line><line x1="9" y1="3" x2="9" y2="6"></line><line x1="15" y1="3" x2="15" y2="6"></line></svg>
            <span data-label="nav.tracker">Suivi</span>
          </button>
          <button class="nav-btn" type="button" data-nav="bonus">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 L20 12 L12 22 L4 12 Z"></path></svg>
            <span data-label="nav.bonus">Bonus</span>
          </button>
        </nav>

        <div class="sheet-overlay" id="sheetOverlay" hidden></div>
        <div class="settings-sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
          <div class="sheet-grabber" aria-hidden="true"></div>
          <h3 id="settingsTitle">Paramètres</h3>
          <p class="sheet-label" id="sheetLangLabel">Langue</p>
          <div class="lang-row" id="langRow">
            <button type="button" data-lang="pt-BR">PT-BR</button>
            <button type="button" data-lang="fr">FR</button>
            <button type="button" data-lang="en">EN</button>
          </div>
          <div class="theme-row">
            <div>
              <p id="sheetThemeLabel">Thème</p>
              <small id="themeValue">Clair</small>
            </div>
            <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Changer le mode d'affichage">
              <span class="knob"></span>
            </button>
          </div>
          <button class="sheet-done-btn" id="sheetDoneBtn" type="button">Terminé</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
